metadata:
  id: CKV2_CUSTOM_AZURE_1002
  name: APIM identity must access the team Key Vault
  category: IAM
  severity: HIGH
definition:
  and:
  - cond_type: filter
    attribute: resource_type
    operator: within
    value:
    - azurerm_role_assignment
  - cond_type: attribute
    resource_types:
    - azurerm_role_assignment
    attribute: role_definition_name
    operator: equals
    value: Key Vault Secrets User
  - cond_type: connection
    resource_types:
    - azurerm_role_assignment
    connected_resource_types:
    - azurerm_user_assigned_identity
    operator: exists
  - cond_type: connection
    resource_types:
    - azurerm_role_assignment
    connected_resource_types:
    - azurerm_key_vault
    operator: exists
