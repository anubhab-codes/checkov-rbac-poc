metadata:
  id: CKV2_CUSTOM_AZURE_1003
  name: AI Search identity must read documents from Storage
  category: IAM
  severity: HIGH
definition:
  and:
  - cond_type: filter
    attribute: resource_type
    operator: within
    value:
    - azurerm_role_assignment
  - cond_type: attribute
    resource_types:
    - azurerm_role_assignment
    attribute: role_definition_name
    operator: equals
    value: Storage Blob Data Reader
  - cond_type: connection
    resource_types:
    - azurerm_role_assignment
    connected_resource_types:
    - azurerm_user_assigned_identity
    operator: exists
  - cond_type: connection
    resource_types:
    - azurerm_role_assignment
    connected_resource_types:
    - azurerm_storage_account
    operator: exists
