metadata:
  id: "CKV2_CUSTOM_AZURE_001"
  name: "APIM identity must have Cognitive Services User access to Content Safety"
  category: "IAM"
  severity: "HIGH"

definition:
  and:

    - cond_type: filter
      attribute: resource_type
      operator: within
      value:
        - azurerm_role_assignment

    - cond_type: attribute
      resource_types:
        - azurerm_role_assignment
      attribute: role_definition_name
      operator: equals
      value: "Cognitive Services User"

    - cond_type: connection
      resource_types:
        - azurerm_role_assignment
      connected_resource_types:
        - azurerm_user_assigned_identity
      operator: exists

    - cond_type: connection
      resource_types:
        - azurerm_role_assignment
      connected_resource_types:
        - azurerm_cognitive_account
      operator: exists