# Security-owned RBAC matrix
#
# Each row follows:
# [source, role, terraform_assignment_name]

targets:

  azurerm_cognitive_account.content_safety:
    - [azurerm_user_assigned_identity.apim_identity, "Cognitive Services User", apim_content_safety]

  azurerm_key_vault.team_kv:
    - [azurerm_user_assigned_identity.apim_identity, "Key Vault Secrets User", apim_keyvault]
    - [azurerm_user_assigned_identity.app_identity, "Key Vault Secrets User", app_keyvault]

  azurerm_storage_account.documents:
    - [azurerm_user_assigned_identity.search_identity, "Storage Blob Data Reader", search_storage]
    - [azurerm_user_assigned_identity.app_identity, "Storage Blob Data Contributor", app_storage]