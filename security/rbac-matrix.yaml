assignments:

  - id: APIM_CONTENT_SAFETY
    description: APIM identity must access Content Safety
    assignment_name: apim_content_safety
    source: azurerm_user_assigned_identity.apim_identity
    target: azurerm_cognitive_account.content_safety
    role: Cognitive Services User

  - id: APIM_KEYVAULT
    description: APIM identity must access the team Key Vault
    assignment_name: apim_keyvault
    source: azurerm_user_assigned_identity.apim_identity
    target: azurerm_key_vault.team_kv
    role: Reader

  - id: SEARCH_STORAGE
    description: AI Search identity must read documents from Storage
    assignment_name: search_storage
    source: azurerm_user_assigned_identity.search_identity
    target: azurerm_storage_account.documents
    role: Storage Blob Data Reader