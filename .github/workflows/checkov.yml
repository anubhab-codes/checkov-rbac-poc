name: Terraform RBAC Checkov Validation

on:
  push:
  pull_request:

jobs:
  rbac-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pip install checkov pyyaml

      - name: Run custom Checkov RBAC policy
        run: |
          checkov \
            -d terraform \
            --framework terraform \
            --external-checks-dir checkov/custom_checks \
            --check CKV_CUSTOM_AZURE_RBAC_001